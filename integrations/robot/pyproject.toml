[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "edgelens-robot"
dynamic = ["version"]
description = "Robot Framework library for the EdgeLens Edge AI Device Farm."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "EdgeLens", email = "support@edgelens.ai" }]
requires-python = ">=3.9"
keywords = ["robotframework", "edgelens", "testing"]
classifiers = [
    "Framework :: Robot Framework",
    "Framework :: Robot Framework :: Library",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "edgelens-sdk>=0.2.4,<0.3",
    "robotframework>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://edgelens.ai"
Repository = "https://github.com/edgelens-ai/edgelens-sdk"
Issues = "https://github.com/edgelens-ai/edgelens-sdk/issues"

[tool.hatch.build.targets.sdist]
include = ["/EdgeLensLibrary", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["EdgeLensLibrary"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.hatch.version]
path = "EdgeLensLibrary/_version.py"
