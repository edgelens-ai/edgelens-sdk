[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "edgelens-cli"
dynamic = ["version"]
description = "Command-line interface for the EdgeLens Edge AI Device Farm."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "EdgeLens", email = "support@edgelens.ai" }]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "edgelens-sdk>=0.2.4,<0.3",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.scripts]
edgelens = "edgelens_cli.main:cli"

[project.urls]
Homepage = "https://edgelens.ai"
Repository = "https://github.com/edgelens-ai/edgelens-sdk"
Issues = "https://github.com/edgelens-ai/edgelens-sdk/issues"

[tool.hatch.build.targets.sdist]
include = ["/edgelens_cli", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["edgelens_cli"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
strict = true
python_version = "3.9"

[tool.hatch.version]
path = "edgelens_cli/__init__.py"
