name: EdgeLens tests (Playwright)
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: edgelens-ai/edgelens-sdk/ci/github-action@v0.2.4
        with:
          api-key: ${{ secrets.EDGELENS_API_KEY }}
          # Playwright's JUnit reporter writes to results.xml by default;
          # we pass --reporter=junit and pin junit-file to match.
          command: npx playwright test --reporter=junit --output=test-results
          junit-file: results.xml
