[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "edgelens-sdk"
dynamic = ["version"]
description = "Python client for the EdgeLens Edge AI Device Farm"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "EdgeLens", email = "support@edgelens.ai" }]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-httpx>=0.30",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://edgelens.ai"
Repository = "https://github.com/edgelens-ai/edgelens-sdk"
Issues = "https://github.com/edgelens-ai/edgelens-sdk/issues"
Documentation = "https://docs.edgelens.ai"

[tool.hatch.build.targets.sdist]
include = ["/edgelens", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
# The distribution is edgelens-sdk; the import package keeps the name edgelens.
packages = ['edgelens']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
strict = true
python_version = "3.9"

[tool.hatch.version]
path = "edgelens/_version.py"
